[project]
name = "begin-set"
version = "1.0.0"
description = "カレントを移して、カレント以下のディレクトリを全部インポートパスに登録する。"
readme = "README.md"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "preserve"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-p no:cacheprovider"
